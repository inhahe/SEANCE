name: Build macOS DMG

on: [push, workflow_dispatch]

jobs:
  mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Make DMG
        run: |
          mkdir dmg
          cp -R "build/Release/MyApp.app" dmg/
          hdiutil create -volname "MyApp" \
            -srcfolder dmg \
            -ov -format UDZO \
            MyApp.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MyApp-macOS-dmg
          path: MyApp.dmg